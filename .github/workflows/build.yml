name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14            # Apple Silicon
            arch: arm64
            platform: mac
          - os: macos-15-intel      # Intel (macos-13 is deprecated)
            arch: x64
            platform: mac
          - os: windows-latest
            arch: x64
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout shell
        uses: actions/checkout@v4

      - name: Checkout harness (with image bridge)
        uses: actions/checkout@v4
        with:
          repository: usherwong/deepseek-harness
          ref: image-bridge
          path: harness

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install shell dependencies
        run: npm ci

      - name: Stage harness runtime from source
        run: node scripts/prepare-runtime.mjs --mode source --repo harness --arch ${{ matrix.arch }}

      - name: Build macOS installer (arm64)
        if: matrix.platform == 'mac' && matrix.arch == 'arm64'
        run: npx electron-builder --mac --arm64 --publish never

      - name: Build macOS installer (x64)
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        run: npx electron-builder --mac --x64 --publish never

      - name: Build Windows installer
        if: matrix.platform == 'win'
        run: npx electron-builder --win --x64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/*/* \
            --generate-notes \
            --title "DeepSeek Desktop ${GITHUB_REF_NAME}"
